<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KOPPE</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&family=JetBrains+Mono:wght@400;500&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0b0d12;
    --bg2: #13161e;
    --bg3: #1a1e2a;
    --border: rgba(255,255,255,0.08);
    --border-strong: rgba(255,255,255,0.25);
    --text: #f0f2f8;
    --muted: rgba(240,242,248,0.45);
    --accent: #4f8ef7;
    --accent2: #7ab3ff;
    --tram: #e8552a;
    --bus: #6db56d;
    --sbahn: #3fa35e;
    --ubahn: #2b6fce;
  }

  html, body {
    width: 100%; height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', system-ui, sans-serif;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* MAXIMIERTE VISUELLE TRENNUNG DURCH REINES FLEX-GRID */
  .grid {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    width: 100vw;
    height: 100vh;
    padding: 35px 50px;
    gap: 0;
  }

  /* Massiver vertikaler Trennbalken mit extremem Freiraum (60px links und rechts) */
  .divider-v { 
    background: var(--border-strong); 
    width: 2px;
    margin: 0 60px; 
    height: 100%;
  }

  /* Spalten-Layout */
  .left { 
    grid-column: 1; 
    display: flex; 
    flex-direction: column; 
    gap: 0;
  }
  .right { 
    grid-column: 3; 
    display: flex; 
    flex-direction: column;
  }

  .section-label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8px;
  }

  .logo {
    font-size: 52px;
    font-weight: 900;
    letter-spacing: -0.03em;
    line-height: 1;
    color: var(--text);
    margin-bottom: 4px;
  }
  .station-name {
    font-size: 14px;
    font-weight: 500;
    color: var(--muted);
    margin-bottom: 30px;
    letter-spacing: 0.02em;
  }

  /* ── DEPARTURES TABLE (REAL LIFE AUFBAU) ── */
  .departures { flex: 1; display: flex; flex-direction: column; }
  .dep-table { width: 100%; border-collapse: collapse; table-layout: fixed; }
  
  .dep-table thead tr th {
    text-align: left;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    padding: 0 0 12px 0;
    border-bottom: 2px solid var(--border-strong);
  }
  
  .dep-table thead tr th.col-line { width: 85px; }
  .dep-table thead tr th.col-dest { width: auto; padding-left: 15px; }
  .dep-table thead tr th.col-time { width: 120px; text-align: right; padding-right: 5px; }

  .dep-table tbody tr {
    border-bottom: 1px solid var(--border);
  }
  .dep-table tbody tr td {
    padding: 14px 0;
    font-size: 19px;
    font-weight: 400;
    vertical-align: middle;
  }

  .line-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 3px 10px;
    border-radius: 5px;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.03em;
    white-space: nowrap;
    min-width: 45px;
  }
  .line-tram { background: var(--tram); color: #fff; }
  .line-bus { background: var(--bus); color: #fff; }
  .line-sbahn { background: var(--sbahn); color: #fff; }
  .line-ubahn { background: var(--ubahn); color: #fff; }
  .line-night { background: #0e1535; color: #8ab0ff; border: 1px solid #2a4aa0; }

  .dest-col {
    font-size: 19px;
    font-weight: 500;
    color: var(--text);
    padding-left: 15px !important;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* BÜNDIGE ZEITANZEIGE RECHTS */
  .time-container {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    justify-content: center;
    padding-right: 5px;
    font-family: 'JetBrains Mono', monospace;
    text-align: right;
  }
  .time-main-display {
    font-size: 21px;
    font-weight: 500;
    color: var(--text);
    letter-spacing: 0.02em;
    line-height: 1.1;
  }
  .time-main-display.imminent { color: #ff6b6b; }
  
  .delay-above {
    font-size: 11px;
    font-weight: 600;
    color: #ff6b6b;
    line-height: 1;
    margin-bottom: 2px;
    height: 11px;
  }
  .clock-subtext {
    font-size: 11px;
    color: var(--muted);
    margin-top: 2px;
    line-height: 1;
  }

  .loading-row td {
    padding: 35px 0;
    color: var(--muted);
    font-size: 15px;
    text-align: center !important;
  }

  /* ── RIGHT PANEL COMPONENTS ── */
  .clock-row {
    display: flex;
    align-items: baseline;
    justify-content: flex-end;
    margin-bottom: 15px;
    gap: 6px;
  }
  .clock {
    font-family: 'JetBrains Mono', monospace;
    font-size: 54px;
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1;
    color: var(--text);
  }
  .clock-seconds {
    font-family: 'JetBrains Mono', monospace;
    font-size: 26px;
    font-weight: 400;
    color: var(--muted);
    align-self: flex-end;
    padding-bottom: 4px;
  }
  .date-text {
    font-size: 13px;
    color: var(--muted);
    text-align: right;
    margin-top: 4px;
    margin-bottom: 30px;
    letter-spacing: 0.04em;
  }

  /* ── WEATHER ── */
  .weather-main {
    display: flex;
    align-items: center;
    gap: 20px;
    margin-bottom: 18px;
  }
  .weather-icon {
    font-size: 68px;
    line-height: 1;
    flex-shrink: 0;
  }
  .weather-temps { display: flex; flex-direction: column; }
  .temp-main {
    font-size: 54px;
    font-weight: 700;
    letter-spacing: -0.03em;
    line-height: 1;
    color: var(--text);
  }
  .temp-main span { font-size: 28px; font-weight: 400; color: var(--muted); }
  .temp-feels {
    font-size: 14px;
    color: var(--muted);
    margin-top: 5px;
  }
  .weather-desc {
    font-size: 18px;
    font-weight: 500;
    color: var(--text);
    margin-bottom: 16px;
  }

  .rain-section { margin-bottom: 20px; }
  .rain-bar-wrap {
    background: var(--bg3);
    border-radius: 6px;
    height: 8px;
    overflow: hidden;
    margin-top: 6px;
    margin-bottom: 4px;
  }
  .rain-bar-fill {
    height: 100%;
    border-radius: 6px;
    background: linear-gradient(90deg, var(--accent), #7ab3ff);
    transition: width 0.5s ease;
  }
  .rain-label-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
    color: var(--muted);
  }
  .rain-pct { font-size: 24px; font-weight: 700; color: var(--accent2); }

  .weather-details {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 25px;
  }
  .detail-pill {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 11px 15px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .detail-icon { font-size: 22px; }
  .detail-label {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .detail-value {
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
  }

  .hourly-label {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 12px;
  }
  .hourly-row {
    display: flex;
    gap: 8px;
    overflow: hidden;
  }
  .hour-card {
    flex: 1;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 11px 6px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    min-width: 0;
  }
  .hour-card.now {
    border-color: var(--accent);
    background: rgba(79,142,247,0.08);
  }
  .hour-time {
    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
    letter-spacing: 0.04em;
  }
  .hour-icon { font-size: 24px; line-height: 1; }
  .hour-temp {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
  }
  .hour-rain {
    font-size: 10px;
    color: #7ab3ff;
    font-weight: 500;
  }
</style>
</head>
<body>

<div class="grid">

  <div class="left">
    <div class="logo">KOPPE</div>
    <div class="station-name">Unter den Birken</div>

    <div class="departures">
      <table class="dep-table">
        <thead>
          <tr>
            <th class="col-line">Linie</th>
            <th class="col-dest">Richtung</th>
            <th class="col-time">Zeit</th>
          </tr>
        </thead>
        <tbody id="dep-body">
          <tr class="loading-row"><td colspan="3">Verbinde mit VBB…</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <div class="divider-v"></div>

  <div class="right">
    <div class="clock-row">
      <div class="clock" id="clock">00:00</div>
      <div class="clock-seconds" id="clock-sec">00</div>
    </div>
    <div class="date-text" id="date-text">–</div>

    <div class="section-label">Wetter · Berlin-Köpenick</div>

    <div class="weather-main">
      <div class="weather-icon" id="w-icon">⏳</div>
      <div class="weather-temps">
        <div class="temp-main" id="w-temp">–<span>°C</span></div>
        <div class="temp-feels" id="w-feels">Gefühlt wie –°C</div>
      </div>
    </div>

    <div class="weather-desc" id="w-desc">Lade Wetterdaten…</div>

    <div class="rain-section">
      <div class="rain-label-row">
        <span>Regenwahrscheinlichkeit</span>
        <span class="rain-pct" id="w-rain">–%</span>
      </div>
      <div class="rain-bar-wrap">
        <div class="rain-bar-fill" id="rain-bar" style="width:0%"></div>
      </div>
    </div>

    <div class="weather-details">
      <div class="detail-pill">
        <span class="detail-icon">💨</span>
        <div>
          <div class="detail-label">Wind</div>
          <div class="detail-value" id="w-wind">–</div>
        </div>
      </div>
      <div class="detail-pill">
        <span class="detail-icon">💧</span>
        <div>
          <div class="detail-label">Luftfeuchte</div>
          <div class="detail-value" id="w-humidity">–</div>
        </div>
      </div>
      <div class="detail-pill">
        <span class="detail-icon">👁️</span>
        <div>
          <div class="detail-label">UV-Index</div>
          <div class="detail-value" id="w-uv">–</div>
        </div>
      </div>
      <div class="detail-pill">
        <span class="detail-icon">🌡️</span>
        <div>
          <div class="detail-label">Niederschlag</div>
          <div class="detail-value" id="w-precip">–</div>
        </div>
      </div>
    </div>

    <div class="hourly-label">Nächste Stunden</div>
    <div class="hourly-row" id="hourly-row">
      <div class="hour-card"><div class="hour-time">–</div><div class="hour-icon">⏳</div><div class="hour-temp">–</div><div class="hour-rain">–</div></div>
    </div>
  </div>

</div>

<script>
// ─── CLOCK ───────────────────────────────────────────────────
const DAYS = ['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
const MONTHS = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];

function updateClock() {
  const now = new Date();
  const h = String(now.getHours()).padStart(2,'0');
  const m = String(now.getMinutes()).padStart(2,'0');
  const s = String(now.getSeconds()).padStart(2,'0');
  document.getElementById('clock').textContent = h + ':' + m;
  document.getElementById('clock-sec').textContent = s;
  document.getElementById('date-text').textContent =
    DAYS[now.getDay()] + ', ' + now.getDate() + '. ' + MONTHS[now.getMonth()] + ' ' + now.getFullYear();
}
updateClock();
setInterval(updateClock, 1000);


// ─── WEATHER ─────────────────────────────────────────────────
const LAT = 52.4453, LON = 13.5764;

const WMO_ICONS = {
  0: '☀️', 1: '🌤️', 2: '⛅', 3: '☁️',
  45: '🌫️', 48: '🌫️',
  51: '🌦️', 53: '🌦️', 55: '🌧️',
  61: '🌧️', 63: '🌧️', 65: '🌧️',
  71: '🌨️', 73: '🌨️', 75: '❄️',
  80: '🌦️', 81: '🌧️', 82: '⛈️',
  95: '⛈️', 96: '⛈️', 99: '⛈️'
};
const WMO_DESC = {
  0: 'Klarer Himmel', 1: 'Überwiegend klar', 2: 'Teilweise bewölkt', 3: 'Bedeckt',
  45: 'Nebel', 48: 'Gefriernebel',
  51: 'Leichter Nieselregen', 53: 'Nieselregen', 55: 'Starker Nieselregen',
  61: 'Leichter Regen', 63: 'Regen', 65: 'Starker Regen',
  71: 'Leichter Schneefall', 73: 'Schneefall', 75: 'Starker Schneefall',
  80: 'Leichte Regenschauer', 81: 'Regenschauer', 82: 'Starke Regenschauer',
  95: 'Gewitter', 96: 'Gewitter mit Hagel', 99: 'Starkes Gewitter'
};

async function fetchWeather() {
  try {
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}` +
      `&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m,relative_humidity_2m,precipitation,uv_index` +
      `&hourly=temperature_2m,weather_code,precipitation_probability` +
      `&timezone=Europe%2FBerlin&forecast_days=1&wind_speed_unit=kmh`;
    const res = await fetch(url);
    const d = await res.json();
    const c = d.current;

    document.getElementById('w-temp').innerHTML = Math.round(c.temperature_2m) + '<span>°C</span>';
    document.getElementById('w-feels').textContent = 'Gefühlt wie ' + Math.round(c.apparent_temperature) + '°C';
    document.getElementById('w-icon').textContent = WMO_ICONS[c.weather_code] || '🌡️';
    document.getElementById('w-desc').textContent = WMO_DESC[c.weather_code] || '–';
    document.getElementById('w-wind').textContent = Math.round(c.wind_speed_10m) + ' km/h';
    document.getElementById('w-humidity').textContent = Math.round(c.relative_humidity_2m) + '%';
    document.getElementById('w-uv').textContent = Math.round(c.uv_index);
    document.getElementById('w-precip').textContent = c.precipitation.toFixed(1) + ' mm';

    const nowH = new Date().getHours();
    const hourlyTimes = d.hourly.time;
    const hourlyRain = d.hourly.precipitation_probability;
    const hourlyTemp = d.hourly.temperature_2m;
    const hourlyCode = d.hourly.weather_code;
    const nowIdx = hourlyTimes.findIndex(t => new Date(t).getHours() === nowH);
    const rainPct = nowIdx >= 0 ? Math.round(hourlyRain[nowIdx]) : 0;

    document.getElementById('w-rain').textContent = rainPct + '%';
    document.getElementById('rain-bar').style.width = rainPct + '%';

    const start = nowIdx >= 0 ? nowIdx : 0;
    const cards = [];
    for (let i = 0; i < 7; i++) {
      const idx = start + i;
      if (idx >= hourlyTimes.length) break;
      const t = new Date(hourlyTimes[idx]);
      const label = i === 0 ? 'Jetzt' : t.getHours().toString().padStart(2,'0') + ':00';
      cards.push(`
        <div class="hour-card ${i===0?'now':''}">
          <div class="hour-time">${label}</div>
          <div class="hour-icon">${WMO_ICONS[hourlyCode[idx]] || '🌡️'}</div>
          <div class="hour-temp">${Math.round(hourlyTemp[idx])}°</div>
          <div class="hour-rain">${Math.round(hourlyRain[idx])}%</div>
        </div>`);
    }
    document.getElementById('hourly-row').innerHTML = cards.join('');
  } catch(e) {
    document.getElementById('w-desc').textContent = 'Wetterdaten nicht verfügbar';
  }
}

fetchWeather();
setInterval(fetchWeather, 10 * 60 * 1000);


// ─── DEPARTURES (MIT GEFILTERTER TEXT-SUCHE & CORS-PROXY) ───
const STOP_NAME = 'Unter den Birken';

function getLineClass(line, product) {
  if (line && line.toUpperCase().startsWith('N')) return 'line-night';
  switch(product) {
    case 'tram': return 'line-tram';
    case 'subway': return 'line-ubahn';
    case 'suburban': return 'line-sbahn';
    default: return 'line-bus';
  }
}

function formatClockTime(dateObj) {
  return String(dateObj.getHours()).padStart(2,'0') + ':' + String(dateObj.getMinutes()).padStart(2,'0');
}

async function fetchDepartures() {
  try {
    // CORS Anywhere Proxy umgeht die Sperre bei lokaler Ausführung (file:///)
    const proxy = 'https://cors-anywhere.herokuapp.com/';
    const baseLocationUrl = 'https://v6.vbb.transport.rest/locations?query=' + encodeURIComponent(STOP_NAME) + '&results=1';
    
    let stationRes = await fetch(baseLocationUrl);
    if (!stationRes.ok) {
      // Fallback über Proxy falls direkt blockiert
      stationRes = await fetch(proxy + baseLocationUrl);
    }
    
    const stations = await stationRes.json();
    if (!stations || stations.length === 0) throw new Error('Haltestelle nicht gefunden');
    const stopId = stations[0].id;

    const baseDepUrl = `https://v6.vbb.transport.rest/stops/${stopId}/departures?duration=90&results=40`;
    let res = await fetch(baseDepUrl);
    if (!res.ok) {
      res = await fetch(proxy + baseDepUrl);
    }
    if (!res.ok) throw new Error('HTTP ' + res.status);
    
    const d = await res.json();
    const deps = d.departures || d;

    if (!deps || deps.length === 0) {
      document.getElementById('dep-body').innerHTML =
        '<tr class="loading-row"><td colspan="3" style="color:var(--muted)">Keine Abfahrten in den nächsten 90 Min</td></tr>';
      return;
    }

    // Filter auf Köpenick oder Weißensee (Mahlsdorf wird ignoriert)
    const filteredDeps = deps.filter(dep => {
      const destName = (dep.destination && dep.destination.name) ? dep.destination.name.toLowerCase() : '';
      const directionName = dep.direction ? dep.direction.toLowerCase() : '';
      
      const matchesKopenick = destName.includes('köpenick') || directionName.includes('köpenick');
      const matchesWeissensee = destName.includes('weißensee') || directionName.includes('weißensee') || 
                                destName.includes('pasedagplatz') || directionName.includes('pasedagplatz');
      
      return matchesKopenick || matchesWeissensee;
    });

    if (filteredDeps.length === 0) {
      document.getElementById('dep-body').innerHTML =
        '<tr class="loading-row"><td colspan="3" style="color:var(--muted)">Keine passenden Fahrten gefunden</td></tr>';
      return;
    }

    const rows = filteredDeps
      .filter(dep => dep.when || dep.plannedWhen)
      .slice(0, 7)
      .map(dep => {
        const when = dep.when || dep.plannedWhen;
        const dt = new Date(when);
        const delay = dep.delay ? Math.round(dep.delay / 60) : 0;
        const diffMin = Math.round((dt - Date.now()) / 60000);
        
        const clockStr = formatClockTime(dt);
        const line = dep.line || {};
        const name = line.name || '?';
        const css = getLineClass(name, line.product);
        
        let rawDir = (dep.destination && dep.destination.name ? dep.destination.name : dep.direction || '?');
        rawDir = rawDir.replace('(Berlin)', '').replace(', Stellingdamm', '').replace('Stellingdamm', '').trim();
        
        if (rawDir.toLowerCase().includes('köpenick')) {
          rawDir = 'S Köpenick';
        } else if (rawDir.toLowerCase().includes('pasedagplatz') || rawDir.toLowerCase().includes('weißensee')) {
          rawDir = 'Weißensee, Pasedagplatz';
        }

        let minsLabel = diffMin <= 1 ? (diffMin <= 0 ? 'jetzt' : '1 min') : `${diffMin}'`;
        let imminentClass = diffMin <= 1 ? ' imminent' : '';
        const delayHtml = delay > 0 ? `+${delay} min` : '&nbsp;';

        // PRÄZISER REAL LIFE AUFBAU: LINIE | RICHTUNG | ZEIT RECHTS BÜNDIG
        return `<tr>
          <td><span class="line-badge ${css}">${name}</span></td>
          <td class="dest-col">${rawDir}</td>
          <td>
            <div class="time-container">
              <div class="delay-above">${delayHtml}</div>
              <div class="time-main-display${imminentClass}">${minsLabel}</div>
              <div class="clock-subtext">${clockStr}</div>
            </div>
          </td>
        </tr>`;
      }).join('');

    document.getElementById('dep-body').innerHTML = rows;

  } catch(e) {
    document.getElementById('dep-body').innerHTML = `
      <tr class="loading-row">
        <td colspan="3" style="color:var(--muted);font-size:13px;">
          ⚠️ Abfahrten temporär nicht verfügbar<br>
          <span style="font-size:11px; opacity:0.5;">Fahrplan-Server blockiert lokale file:/// Anfragen</span>
        </td>
      </tr>`;
  }
}

fetchDepartures();
setInterval(fetchDepartures, 20 * 1000);
</script>
</body>
</html>
